name: Pages

# Deploys the landing page in site/ to GitHub Pages. Enable it once in Settings → Pages → Source:
# GitHub Actions (see site/README.md; on a private repository Pages needs a paid plan).
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Links, images, alt text and the page weight budget; needs no dependencies.
      - run: bun scripts/site-check.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
