name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches src/version.ts
        run: |
          version=$(bun -e "import { VERSION } from './src/version'; console.log(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.ts ($version)" >&2
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/build.ts all
      - run: bun scripts/smoke.ts dist/pixeltwin-*-linux-x64
      - run: bun scripts/build-sdk.ts pack dist/sdk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pixeltwin-*
            dist/SHA256SUMS
            dist/sdk/*.tgz

  npm:
    needs: binaries
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-sdk.ts
      - name: Publish the SDK (skipped without an NPM_TOKEN secret)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: the SDK is on the GitHub release only."
            exit 0
          fi
          (cd packages/client && npm publish --provenance --access public)
          (cd packages/playwright && npm publish --provenance --access public)
          (cd packages/wdio && npm publish --provenance --access public)

  image:
    needs: binaries
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixeltwin
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
