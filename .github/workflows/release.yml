name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches src/version.ts
        run: |
          version=$(bun -e "import { VERSION } from './src/version'; console.log(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.ts ($version)" >&2
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/build.ts all
      - run: bun scripts/smoke.ts dist/pixeltwin-*-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pixeltwin-*
            dist/SHA256SUMS

  image:
    needs: binaries
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixeltwin
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
