name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium # test/sdk runs a real Playwright suite
      - run: bun test

  test-postgres:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixeltwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pixeltwin_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun test

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  smoke:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts linux-x64
      - run: bun scripts/smoke.ts dist/pixeltwin-*-linux-x64

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t pixeltwin:ci .
      - name: Start the container
        run: |
          docker run -d --name pixeltwin -e PUBLIC_URL=http://localhost:8080 -p 8080:8080 pixeltwin:ci
          for _ in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
      - name: Smoke test the container
        run: |
          token=$(docker logs pixeltwin 2>&1 | grep -o '"setupToken":"[^"]*"' | cut -d'"' -f4)
          bun scripts/smoke.ts --url http://localhost:8080 --token "$token"
      - name: Container logs on failure
        if: failure()
        run: docker logs pixeltwin

  helm:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint both storage modes
        run: |
          helm lint deploy/helm/pixeltwin --strict --set publicUrl=https://pixeltwin.example.com
          helm lint deploy/helm/pixeltwin --strict --set publicUrl=https://pixeltwin.example.com,storage=postgres \
            --set database.url=postgres://u:p@db:5432/pixeltwin,replicaCount=3,ingress.enabled=true
      - name: The chart refuses settings that cannot work
        run: |
          refuse() { if helm template t deploy/helm/pixeltwin "$@" >/dev/null 2>&1; then echo "accepted: $*"; exit 1; fi; }
          refuse                                              # no publicUrl
          refuse --set publicUrl=https://a,storage=postgres   # no database URL
          refuse --set publicUrl=https://a,setupToken=short   # setup token under 16 characters
