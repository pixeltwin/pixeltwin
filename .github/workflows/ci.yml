name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  test-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixeltwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pixeltwin_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts linux-x64
      - run: bun scripts/smoke.ts dist/pixeltwin-*-linux-x64

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t pixeltwin:ci .
      - name: Start the container
        run: |
          docker run -d --name pixeltwin -e PUBLIC_URL=http://localhost:8080 -p 8080:8080 pixeltwin:ci
          for _ in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
      - name: Smoke test the container
        run: |
          token=$(docker logs pixeltwin 2>&1 | grep -o '"setupToken":"[^"]*"' | cut -d'"' -f4)
          bun scripts/smoke.ts --url http://localhost:8080 --token "$token"
      - name: Container logs on failure
        if: failure()
        run: docker logs pixeltwin
