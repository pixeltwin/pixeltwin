<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products · Pixel Shop</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/demo-change.css" />
    <script src="/clock.js" defer></script>
  </head>
  <body>
    <header>
      <span class="logo">Pixel Shop</span>
      <nav>
        <a href="/">Home</a>
        <a href="/products.html" aria-current="page">Products</a>
        <a href="/about.html">About</a>
      </nav>
      <span class="clock"></span>
    </header>
    <main>
      <section class="hero">
        <h1>Products</h1>
        <p>Three things, three colours.</p>
      </section>
      <div class="grid">
        <article class="card">
          <div class="swatch" style="background: #f59e0b"></div>
          <h3>Amber mug</h3>
          <p class="price">€12</p>
          <a class="btn" href="/products.html">Buy</a>
        </article>
        <article class="card">
          <div class="swatch" style="background: #10b981"></div>
          <h3>Jade notebook</h3>
          <p class="price">€8</p>
          <a class="btn" href="/products.html">Buy</a>
        </article>
        <article class="card">
          <div class="swatch" style="background: #8b5cf6"></div>
          <h3>Violet poster</h3>
          <p class="price">€20</p>
          <a class="btn" href="/products.html">Buy</a>
        </article>
      </div>
    </main>
    <footer>Pixel Shop demo site · rendered at <span class="clock"></span></footer>
  </body>
</html>
