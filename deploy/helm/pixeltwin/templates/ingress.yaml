{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pixeltwin.fullname" . }}
  labels:
    {{- include "pixeltwin.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if not (hasKey $annotations "nginx.ingress.kubernetes.io/proxy-body-size") }}
  {{- /* The largest body the server takes: a base64 image of config.maxImageBytes plus 1 MiB. */}}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (printf "%sm" (include "pixeltwin.bodySizeMiB" .)) }}
  {{- end }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "pixeltwin.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
