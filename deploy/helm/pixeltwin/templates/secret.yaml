{{- include "pixeltwin.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pixeltwin.fullname" . }}
  labels:
    {{- include "pixeltwin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  SETUP_TOKEN: {{ include "pixeltwin.setupToken" . | quote }}
{{- end }}
