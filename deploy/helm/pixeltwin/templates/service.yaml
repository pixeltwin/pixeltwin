apiVersion: v1
kind: Service
metadata:
  name: {{ include "pixeltwin.fullname" . }}
  labels:
    {{- include "pixeltwin.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") (ne (toString .Values.service.nodePort) "") }}
      nodePort: {{ int .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pixeltwin.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
# Metrics have a Service of their own: the Ingress routes the one above, never this one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pixeltwin.fullname" . }}-metrics
  labels:
    {{- include "pixeltwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ int .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "pixeltwin.selectorLabels" . | nindent 4 }}
{{- end }}
